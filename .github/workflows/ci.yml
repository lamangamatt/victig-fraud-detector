name: CI — Myssy Regression Suite

# Purpose: prevent broken code from reaching Streamlit Cloud.
#
# Runs on every push to main and every PR against main. Installs the
# exact pinned dependencies from requirements.txt (same versions
# Streamlit Cloud will install on redeploy), then runs the entire
# Myssy regression suite. If any test fails, the push is flagged and
# main is protected via branch rules (configure separately in GitHub).
#
# None of the tests call the Anthropic API — they exercise deterministic
# scoring and prompt-construction paths — so no API secret is needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  regression:
    name: Myssy regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies (tesseract for OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check core modules
        run: |
          python -m py_compile app.py
          python -m py_compile document_analyzer.py
          python -m py_compile irs_transcript.py

      - name: Import smoke test
        run: |
          python -c "from document_analyzer import DocumentAnalyzer; print('DocumentAnalyzer imported OK')"
          python -c "from irs_transcript import analyze_files; print('irs_transcript imported OK')"

      - name: Run Myssy regression tests
        run: |
          set -e
          failed=0
          for test in test_myssy_*.py; do
            echo ""
            echo "========================================================"
            echo "Running: $test"
            echo "========================================================"
            if python "$test"; then
              echo "PASS: $test"
            else
              echo "FAIL: $test"
              failed=$((failed + 1))
            fi
          done
          echo ""
          echo "========================================================"
          if [ "$failed" -gt 0 ]; then
            echo "❌ $failed test file(s) failed"
            exit 1
          else
            echo "✅ All Myssy regression tests passed"
          fi
